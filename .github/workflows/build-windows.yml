name: Build Windows

on:
  push:
    branches: [ main ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/**'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Clone SFML 3
        run: git clone --depth 1 --branch 3.0.0 https://github.com/SFML/SFML.git sfml-src

      - name: Configure SFML
        run: >
          cmake -S sfml-src -B sfml-build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build SFML
        run: cmake --build sfml-build --config Release

      - name: Install SFML
        run: cmake --install sfml-build --prefix "${{ github.workspace }}/sfml-install"

      - name: Configure Project
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_BUILD_TYPE=Release
          -DSFML_DIR="${{ github.workspace }}/sfml-install/lib/cmake/SFML"
          -DSFML_STATIC_LIBRARIES=ON

      - name: Build Project
        run: cmake --build build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chess_engine_windows
          path: build/Release/chess_engine.exe